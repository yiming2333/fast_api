[pytest]
# 测试发现：仅扫描 tests/ 目录，避免误把生产代码当测试收集
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 严格标记：使用未注册的 marker 会被识别为错误，防止 CI 中悄悄漏掉
markers =
    smoke: 主流程冒烟测试
    items: 商品相关
    users: 用户相关
    auth: 认证相关
    files: 文件上传相关
    forms: 表单相关
    examples: 示例端点相关

# 命令行默认参数：彩色输出 + 简洁进度
addopts = -ra --color=yes

# 过滤无关告警，保持测试输出干净
filterwarnings =
    ignore::DeprecationWarning:starlette.testclient
