[pytest]
# 测试发现：仅扫描 tests/ 目录，避免误把生产代码当测试收集
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 严格标记：使用未注册的 marker 会被识别为错误，防止 CI 中悄悄漏掉
markers =
    smoke: 主流程冒烟测试
    items: 商品相关
    users: 用户相关
    auth: 认证相关
    files: 文件上传相关
    forms: 表单相关
    examples: 示例端点相关
    db: SQLAlchemy CRUD 相关

# 命令行默认参数：Allure 原始结果 + 覆盖率统计
# --cov=app               统计 app/ 目录代码覆盖率
# --cov-report=term-missing  终端输出含未覆盖行号
# --cov-report=html       生成 htmlcov/ 目录（便于本地查看）
# 如需临时禁用覆盖率：pytest --no-cov
addopts = -v -s --alluredir=allure-results --cov=app --cov-report=term-missing --cov-report=html

# pytest-asyncio 异步 fixture 支持（auto 模式自动收集 async fixture/test）
asyncio_mode = auto
# session 级事件循环：让 session 作用域 async fixture 与 function 级共存
asyncio_default_fixture_loop_scope = session

# 过滤无关告警，保持测试输出干净
filterwarnings =
    ignore::DeprecationWarning:starlette.testclient
