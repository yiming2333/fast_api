# 本地开发与一键启动用 compose 文件
# 使用：docker compose up --build
# 运行测试：docker compose run --rm test

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: fast_api:latest
    container_name: fast_api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=${APP_NAME:-我的 API}
      - DEBUG=${DEBUG:-false}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # CORS_ORIGINS 改为逗号分隔字符串，避免 YAML 数组被当作字面量
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://localhost:8080}
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0) if urllib.request.urlopen(\"http://127.0.0.1:8000/\").status==200 else sys.exit(1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # CI / 任何环境均可运行的自包含测试容器
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test-runtime
    shm_size: 2g
    image: fast_api:test
    container_name: fast_api_test
    working_dir: /app
    environment:
      - JWT_SECRET_KEY=test-secret-not-for-production
      - TZ=Asia/Shanghai
    # ===== 核心修改 =====
    # 以 root 运行，避免所有权限问题
    user: root
    # 挂载 allure 报告目录到宿主机，方便查看
    volumes:
      - ./allure-results:/app/allure-results
      - ./allure-results:/app/allure-report
      - ./htmlcov:/app/htmlcov           # 覆盖率 HTML 报告（pytest-cov 生成）
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 4G   # 硬限制，防止极端情况撑爆宿主机
    command: pytest -v -s --alluredir=/app/allure-results
    profiles: ["test"]